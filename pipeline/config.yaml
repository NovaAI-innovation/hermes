# Post-scrape RAG pipeline configuration
# See POST_SCRAPE_PIPELINE.md for the architecture this implements.

paths:
  raw_docs: docs
  llms_index: llms.txt
  clean_docs: clean
  corpus: corpus
  eval: eval

normalize:
  strip_nav: true
  strip_footer: true
  remove_heading_anchors: true
  drop_zh_hans: true

chunk:
  # token targets per doc_type
  targets:
    reference: [300, 600]
    guide: [500, 900]
    feature: [400, 700]
    messaging: [400, 700]
    developer: [400, 800]
    getting-started: [500, 800]
    default: [400, 800]
  overlap_tokens: 60
  max_tokens_hard: 1000
  prefix_doc_summary: true

embed:
  # Active provider. Override per-run with EMBED_PROVIDER=... or override the
  # individual profile values with EMBED_MODEL / EMBED_API_BASE.
  #
  #   openrouter     -> https://openrouter.ai/api/v1/embeddings, model
  #                     qwen/qwen3-embedding-4b. ACTIVE.
  #   deepinfra      -> same Qwen3-4B model, native embeddings API.
  #   local          -> Qwen3-Embedding-4B via sentence-transformers on this GPU.
  #   openai_compat  -> any other OpenAI-compatible /embeddings endpoint.
  provider: openrouter
  batch_size: 16
  normalize: true
  # Qwen3-Embedding expects instructions on queries only, never on documents.
  query_instruction: "Given a web search query, retrieve relevant passages that answer the query"

  profiles:
    openrouter:
      model: qwen/qwen3-embedding-4b
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
    deepinfra:
      model: Qwen/Qwen3-Embedding-4B
      api_base: https://api.deepinfra.com/v1/openai
      api_key_env: DEEPINFRA_API_KEY
    local:
      model: Qwen/Qwen3-Embedding-4B
      api_key_env: null
    openai_compat:
      model: Qwen/Qwen3-Embedding-4B
      api_base: http://localhost:8000/v1
      api_key_env: EMBED_API_KEY

retrieve:
  dense_weight: 0.65
  top_k: 20
  final_k: 6

bm25:
  k1: 1.5
  b: 0.75
