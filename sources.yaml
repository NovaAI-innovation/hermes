# Source registry. Every llms.txt you list here is scraped, normalized,
# chunked and indexed into ONE corpus. Order does not matter.
#
# Per source:
#   name        stable id; becomes the chunk prefix, payload field and filter value.
#   llms_txt    https:// URL, or a path relative to this file.
#   title       display name used in citations and the outline tool.
#   include     optional list of regexes; URLs must match at least one.
#   exclude     optional list of regexes; matching URLs are dropped.
#   doc_types   optional path-prefix -> doc_type map (first match wins).
#   normalize   optional chrome-stripping overrides (defaults cover Docusaurus
#               and most documentation generators).

# Where per-source directories live. Each source becomes
#   <root>/<name>/llms.txt, <root>/<name>/docs/, <root>/<name>/clean/
# Relative to this file.
root: sources

defaults:
  doc_types:
    reference/: reference
    reference: reference
    api/: reference
    guides/: guide
    guide/: guide
    tutorials/: guide
    getting-started/: guide
    concepts/: guide
    developer/: developer
    contributing: developer
  exclude:
    - "/zh-Hans/"
    - "/zh-CN/"
    - "/ja/"
    - "/ko/"

sources:
  - name: hermes
    title: Hermes Agent
    llms_txt: https://hermes-agent.nousresearch.com/docs/llms.txt
    exclude:
      - "/zh-Hans/"
    doc_types:
      reference/: reference
      developer-guide/: developer
      user-guide/messaging/: messaging
      user-guide/features/: feature
      user-guide/: guide
      getting-started/: getting-started
      guides/: guide
      integrations/: guide
    normalize:
      # Docusaurus sidebar/footer markers, in priority order.
      footer_markers:
        - '^\[.*\]\(https://github\.com/.*/edit/'
        - '^Built by \['
        - '^Docs\s*$'
        - '^Community\s*$'
        - '^More\s*$'

  - name: mcp
    title: Model Context Protocol
    llms_txt: https://modelcontextprotocol.io/llms.txt
    # This llms.txt lists every protocol version; index only the newest so the
    # corpus is not tripled with near-duplicate pages.
    prefer_latest_version: true
    doc_types:
      # Versioned MCP paths (2024-11-05/..., 2026-07-28/...) lead with the
      # version, so match on the topic segment rather than the prefix.
      guide/: guide
      develop/: guide
      learn/: guide
      examples/: guide
      tutorials/: guide
      tools/: guide
      specification: reference
      spec/: reference
      schema: reference
      sdk: reference
      default: guide

