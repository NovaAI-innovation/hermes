name: hermes-docs-qdrant

version: 1.1.0

description: >-

  Qdrant-backed retrieval over the Hermes documentation corpus. Hybrid dense +

  sparse search across 249 docs / ~4.6k chunks, exposed as agent tools.

author: local

provides_tools:

  - docs_search

  - docs_read

  - docs_outline

requires_env:

  - name: OPENROUTER_API_KEY

    description: Used to embed queries with qwen/qwen3-embedding-4b

    url: https://openrouter.ai/keys

python_dependencies:

  - qdrant-client>=1.9.0

  - fastembed>=0.4.0

  - openai>=1.40.0

  - httpx>=0.27.0
