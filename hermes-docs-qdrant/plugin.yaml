name: hermes-docs-qdrant

version: 2.2.0

description: >-

  Self-contained documentation corpus plugin. Serves hybrid retrieval over any
  set of llms.txt docs, embedded with qwen/qwen3-embedding-4b into Qdrant, as
  agent tools. Corpus building is done ahead of time via cli.py; only the
  runtime tools are installed as dependencies. All generated data lives in the
  plugin data home, not the install tree.

author: local

provides_tools:

  - docs_search

  - docs_search_many

  - docs_read

  - docs_outline

  - docs_list

  - docs_stats

  - docs_diagnostics

  - docs_rebuild

requires_env:

  - name: OPENROUTER_API_KEY

    description: Used to embed queries with qwen/qwen3-embedding-4b

    url: https://openrouter.ai/keys

# Runtime dependencies. These bounds are mirrored in compat.py and
# requirements-runtime.txt; test_contract.py fails if the three disagree.
#
# qdrant-client is >= 1.10.0, not >= 1.9.0: store.py uses query_points,
# Prefetch and FusionQuery for dense+BM25 RRF fusion, and none of those exist
# before 1.10.0. A manifest that admits 1.9.x lets a resolver install a client
# the code cannot drive — the plugin then registers its tools and every
# check_fn silently returns False. compat.py additionally asserts the three
# APIs are present so a floor that is wrong in the future fails loudly instead
# of silently.
#
# The corpus toolchain (crawl4ai, tiktoken, sentence-transformers) is
# deliberately absent: crawl4ai pins snowballstemmer<3, which conflicts with
# Hermes core's snowballstemmer==3.1.1 on Python >= 3.14. Build the corpus in
# its own environment with requirements-build.txt; the runtime tools only read
# the finished store.
python_dependencies:

  - qdrant-client>=1.10.0,<2.0

  - fastembed>=0.4.0

  - openai>=1.40.0

  - httpx>=0.27.0

  - pyyaml>=6.0
