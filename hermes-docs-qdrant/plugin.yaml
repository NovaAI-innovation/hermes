name: hermes-docs-qdrant

version: 2.0.1

description: >-

  Self-contained documentation corpus plugin. Serves hybrid retrieval over any

  set of llms.txt docs, embedded with qwen/qwen3-embedding-4b into Qdrant, as

  agent tools. Corpus building is done ahead of time via cli.py; only the

  runtime tools are installed as dependencies. All generated data lives in the

  plugin data home, not the install tree.

author: local

provides_tools:

  - docs_search

  - docs_read

  - docs_outline

requires_env:

  - name: OPENROUTER_API_KEY

    description: Used to embed queries with qwen/qwen3-embedding-4b

    url: https://openrouter.ai/keys

# Runtime dependencies only. Deliberately excludes the corpus toolchain
# (crawl4ai, tiktoken, python-dotenv): crawl4ai pins snowballstemmer<3, which
# conflicts with Hermes core's snowballstemmer==3.1.1 on Python >= 3.14.
# Build the corpus in a separate env with `pip install -r requirements.txt`;
# the tools then read the finished store. pyyaml stays because fastembed pulls
# huggingface_hub, which needs it at import time.
python_dependencies:

  - qdrant-client>=1.9.0

  - fastembed>=0.4.0

  - openai>=1.40.0

  - httpx>=0.27.0

  - pyyaml>=6.0
