name: hermes-docs-qdrant

version: 2.0.0

description: >-

  Self-contained documentation corpus plugin. Scrapes any set of llms.txt

  sources, normalizes and chunks them, embeds with qwen/qwen3-embedding-4b into

  Qdrant, and exposes hybrid retrieval as agent tools. All generated data lives

  in the plugin data home, not the install tree.

author: local

provides_tools:

  - docs_search

  - docs_read

  - docs_outline

requires_env:

  - name: OPENROUTER_API_KEY

    description: Used to embed documents and queries with qwen/qwen3-embedding-4b

    url: https://openrouter.ai/keys

python_dependencies:

  - qdrant-client>=1.9.0

  - fastembed>=0.4.0

  - openai>=1.40.0

  - httpx>=0.27.0

  - pyyaml>=6.0

  - tiktoken>=0.7.0

  - crawl4ai>=0.7.0
